<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nono 设置</title>
  <link rel="stylesheet" href="./settings.css">
</head>
<body>
  <main class="panel">
    <aside class="side">
      <div class="side-title">设置</div>
      <button class="nav active" type="button" data-section="agents">智能体</button>
      <button class="nav" type="button" data-section="rules">规则</button>
    </aside>

    <div class="content">
      <header class="head">
        <h1 id="section-title">智能体</h1>
        <p id="section-desc">选择哪些 agent 显示在刘海屏中</p>
      </header>

      <div class="scroll">
        <section class="agents" id="agents"></section>
        <section class="rules" id="rules" hidden></section>
      </div>

      <footer class="foot">
        <span class="error" id="error"></span>
        <button id="cancel">取消</button>
        <button class="primary" id="save">保存</button>
      </footer>
    </div>
  </main>

  <script src="./settings.js"></script>
</body>
</html>
